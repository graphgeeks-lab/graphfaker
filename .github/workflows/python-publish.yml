# Builds the package when a GitHub release is published and uploads it to PyPI
# with trusted publishing (no API token). One-time setup on PyPI: under the
# graphfaker project, "Publishing" -> add a trusted publisher with
# owner graphgeeks-lab, repository graphfaker, workflow python-publish.yml,
# environment pypi.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag=$TAG version=$VERSION"
          test "$TAG" = "$VERSION"

      - name: Build
        run: uv build

      - name: Smoke test the wheel
        run: |
          uv venv smoke
          uv pip install --python smoke dist/*.whl
          smoke/bin/graphfaker domains
          smoke/bin/python -c "import graphfaker; print(graphfaker.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/graphfaker/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
