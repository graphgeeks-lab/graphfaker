# Builds the package when a GitHub release is published and uploads it to PyPI.
#
# Authentication is an API token, held in the `pypi` environment's secrets as
# PYPI_API_TOKEN. Scope it to the graphfaker project rather than the whole
# account, so that a leak costs this project and nothing else, and treat it
# as a credential with a rotation cost, which is what the alternative below
# exists to avoid.
#
# The better arrangement is trusted publishing, where PyPI issues a
# short-lived credential to this workflow and there is nothing in the
# repository to leak or rotate. It needs one-time setup on PyPI, and until a
# publisher exists whose fields match this workflow's OIDC claims exactly,
# every run fails with `invalid-publisher: valid token, but no corresponding
# publisher`. The project is already on PyPI, so the publisher goes under the
# project; the account page's pending publishers exist only to create new
# projects and are never consulted for one that already exists.
#
#   pypi.org -> graphfaker -> Manage -> Publishing -> GitHub Actions
#     owner        graphgeeks-lab
#     repository   graphfaker
#     workflow     python-publish.yml   (the filename, not the `name:` below)
#     environment  pypi
#
# To switch back, delete the `password:` line from the publish step. Leave
# `id-token: write` in place either way: the action attests the upload by
# default and that path wants the OIDC token, so dropping the permission
# fails a token-authenticated run for a second, unrelated-looking reason.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag=$TAG version=$VERSION"
          test "$TAG" = "$VERSION"

      - name: Check the version is not already on PyPI
        run: python scripts/check_unpublished.py

      - name: Build
        run: uv build

      - name: Smoke test the wheel
        run: |
          uv venv smoke
          uv pip install --python smoke dist/*.whl
          smoke/bin/graphfaker domains
          smoke/bin/python -c "import graphfaker; print(graphfaker.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/graphfaker/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
