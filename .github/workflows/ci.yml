name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          # One Windows job: the reproducibility contract says the same seed gives
          # the same bytes on any machine, so at least one other OS must run.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # Installs the versions pinned in uv.lock into a project venv.
      # The examples extra brings the ladybug driver, so the LadybugDB sink tests run.
      - name: Install
        run: uv sync --locked --extra dev --extra examples

      - name: Lint
        run: uv run ruff check graphfaker tests

      - name: Test
        run: uv run pytest -q -m "not network"

  pyg:
    # The HeteroData path: the export, its labels and splits, and the baseline
    # script, on CPU torch (see [tool.uv.sources] in pyproject.toml).
    name: PyTorch Geometric export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev --extra pyg
      - name: Test the export
        run: uv run pytest -q tests/test_pyg.py
      - name: Export from the CLI and train the baseline
        run: |
          uv run graphfaker fraud --scale 0.001 --seed 42 --out ./bank --sink pyg --no-report --quiet
          test -f bank/graph.pt
          uv run python examples/pyg_baseline.py --scale 0.001 --epochs 5

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev --extra examples --extra docs
      - name: pip-audit
        run: uv run pip-audit --skip-editable --progress-spinner off

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra docs
      - name: Sphinx
        run: uv run python -m sphinx -q -b html docs docs/_build/html
