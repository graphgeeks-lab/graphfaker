name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          # One Windows job: the reproducibility contract says the same seed gives
          # the same bytes on any machine, so at least one other OS must run.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv pip install --system -e ".[dev]" kuzu

      - name: Lint
        run: ruff check graphfaker tests

      - name: Test
        run: pytest -q -m "not network"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install --system -e ".[dev,examples,docs]"
      - name: pip-audit
        run: pip-audit --skip-editable --progress-spinner off

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install --system -e ".[docs]"
      - name: Sphinx
        run: python -m sphinx -q -b html docs docs/_build/html
